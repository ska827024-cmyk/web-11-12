<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse - All Movies</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Custom Style -->
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --bg-card: #1d1833;
            --primary-purple: #8257e5;
            --text-light: #f3f1f6;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: rgba(15, 12, 27, 0.95);
            backdrop-filter: blur(5px);
        }
        .nav-link.active, .nav-link:hover {
            color: var(--primary-purple) !important;
        }
        .movie-card {
            background-color: var(--bg-card);
            border: none;
            transition: transform 0.3s ease;
        }
        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(130, 87, 229, 0.3);
        }
        .btn-purple {
            background-color: var(--primary-purple);
            color: white;
        }
        .btn-purple:hover {
            background-color: #6f42c1;
            color: white;
        }
        .page-link {
            background-color: var(--bg-card);
            color: var(--text-light);
            border-color: #251f3e;
        }
        .page-link:hover {
            background-color: var(--primary-purple);
            color: white;
        }
        .page-item.active .page-link {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }
        footer {
            background-color: #080610;
            border-top: 1px solid #251f3e;
        }
    </style>
</head>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="index.html" style="color: var(--primary-purple); letter-spacing: 1px;">
                <i class="fa-solid fa-play-cycle me-2"></i>StreamVerse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <form class="d-flex" role="search">

                    <button class="btn btn-outline-purple" type="submit" style="color: var(--primary-purple); border-color: var(--primary-purple);">Search</button>
                </form>
            </div>
        </div>
    </nav>
