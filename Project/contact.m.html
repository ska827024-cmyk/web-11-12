<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVerse - Contact Us</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Custom Style -->
    <style>
        :root {
            --bg-dark: #0f0c1b;
            --bg-card: #1d1833;
            --primary-purple: #8257e5;
            --text-light: #f3f1f6;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: rgba(15, 12, 27, 0.95);
            backdrop-filter: blur(5px);
        }
        .nav-link.active, .nav-link:hover {
            color: var(--primary-purple) !important;
        }
        .contact-card {
            background-color: var(--bg-card);
            border: none;
            border-radius: 12px;
        }
        .form-control, .form-control:focus {
            background-color: #0c0917;
            border-color: #3b335c;
            color: var(--text-light);
        }
        .form-control:focus {
            box-shadow: 0 0 8px rgba(130, 87, 229, 0.5);
            border-color: var(--primary-purple);
        }
        .btn-purple {
            background-color: var(--primary-purple);
            color: white;
        }
        .btn-purple:hover {
            background-color: #6f42c1;
            color: white;
        }
        .contact-icon {
            font-size: 1.5rem;
            color: var(--primary-purple);
            width: 40px;
        }
        .map-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        footer {
            background-color: #080610;
            border-top: 1px solid #251f3e;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="index.html" style="color: var(--primary-purple); letter-spacing: 1px;">
                <i class="fa-solid fa-play-cycle me-2"></i>StreamVerse
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="movies.html">Movies</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2 bg-dark text-light border-secondary" type="search" placeholder="Search movies...">
                    <button class="btn btn-outline-purple" type="submit" style="color: var(--primary-purple); border-color: var(--primary-purple);">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <h2 class="fw-bold mb-5"><span style="border-left: 4px solid var(--primary-purple); padding-left: 10px;">Contact Us</span></h2>

        <div class="row g-5">
            <!-- Left Side: Contact Form -->
            <div class="col-lg-7">
                <div class="p-4 contact-card shadow">
                    <h4 class="fw-bold mb-4">Send Us a Message</h4>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted">First Name</label>
                                <input type="text" class="form-control" placeholder="John" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">Last Name</label>
                                <input type="text" class="form-control" placeholder="Doe" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-muted">Email Address</label>
                                <input type="email" class="form-control" placeholder="johndoe@example.com" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-muted">Subject</label>
                                <input type="text" class="form-control" placeholder="How can we help you?" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-muted">Message</label>
                                <textarea class="form-control" rows="5" placeholder="Type your message here..." required></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-purple px-4 py-2 fw-bold">Send Message <i class="fa-solid fa-paper-plane ms-2"></i></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Side: Info & Map -->
            <div class="col-lg-5 d-flex flex-column justify-content-between gap-4">
                <!-- Info Box -->
                <div class="p-4 contact-card shadow">
                    <h4 class="fw-bold mb-4">Get In Touch</h4>
                    <div class="d-flex flex-column gap-3">
                        <div class="d-flex align-items-start">
                            <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
                            <div>
                                <h6 class="mb-0 fw-bold">Our Headquarters</h6>
                                <p class="text-secondary small mb-0">123 Entertainment Ave, Phnom Penh, Cambodia</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-start">
                            <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
                            <div>
                                <h6 class="mb-0 fw-bold">Email Support</h6>
                                <p class="text-secondary small mb-0">support@streamverse.com</p>
                            </div>
                        </div>
                        <div class="d-flex align-items-start">
                            <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
                            <div>
                                <h6 class="mb-0 fw-bold">Call Us</h6>
                                <p class="text-secondary small mb-0">+855 12 345 678</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Google Map Placeholder -->
                <div class="map-container h-100 min-vh-25">
                    <iframe src="https://google.com" width="100%" height="230" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-muted text-center mt-auto">
        <div class="container">
            <p class="mb-2">&copy; 2026 StreamVerse. All rights reserved.</p>
            <div>
                <a href="#" class="text-muted me-3 text-decoration-none"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="text-muted me-3 text-decoration-none"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="text-muted me-3 text-decoration-none"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="text-muted text-decoration-none"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
