<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="bg-dark text-white">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#">
                StreamVault
            </a>
        </div>
    </nav>
    <!-- Movie Detail -->
    <div class="container py-5">
        <div class="row g-5">
            <!-- Poster -->
            <div class="col-lg-4">
                <img src="https://tse1.mm.bing.net/th/id/OIP.N9OJOcFe9v9e0x22719KXwHaDt?r=0&pid=Api&h=220&P=0"
                     class="img-fluid rounded shadow"
                     alt="Movie Poster">
            </div>
            <!-- Information -->
            <div class="col-lg-8">
                <h1 class="fw-bold mb-3">
                    There Was a Cute Girl in the Hero's Party
                </h1>
                <div class="mb-4">
                    <span class="badge bg-warning text-dark">⭐ 8.5</span>
                    <span class="badge bg-secondary">Fantasy</span>
                    <span class="badge bg-secondary">Adventure</span>
                    <span class="badge bg-danger">13+</span>
                </div>
                <h4>Description</h4>
                <p class="text-light">
                    Youki died in a traffic accident and was reborn in a
                    fantasy world—not as the legendary hero,
                    but as an overpowered demon.
                </p>
                <!-- Buttons -->
                <div class="mt-4">
                    <button class="btn btn-warning me-3">
                        <i class="fa-solid fa-play"></i>
                        Watch Now
                    </button>
                    <button class="btn btn-outline-light">
                        <i class="fa-brands fa-youtube"></i>
                        Trailer
                    </button>
                </div>
                <!-- Cast -->
                <div class="mt-5">
                    <h4>Cast</h4>
                    <div class="d-flex gap-4 mt-3">
                        <div class="text-center">
                            <img src="images/cast1.jpg"
                                 width="80"
                                 class="rounded-circle">
                            <p class="mt-2">Youki</p>
                        </div>
                        <div class="text-center">
                            <img src="images/cast2.jpg"
                                 width="80"
                                 class="rounded-circle">
                            <p class="mt-2">Cecilia</p>
                        </div>
                        <div class="text-center">
                            <img src="images/cast3.jpg"
                                 width="80"
                                 class="rounded-circle">
                            <p class="mt-2">Hero</p>
                        </div>
                    </div>
                </div>
                <!-- Similar Movies -->
                <div class="mt-5">
                    <h4>Similar Movies</h4>
                    <div class="row mt-3">
                        <div class="col-md-4 mb-3">
                            <div class="card bg-secondary">
                                <img src="https://tse3.mm.bing.net/th/id/OIP.V-g8Xd-ZYHlFRA9hgH1emAHaDt?r=0&pid=Api&h=220&P=0"
                                     class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title text-white">
                                        Movie 1
                                    </h6>
                                </div>
                            </div>
                        </div><div class="col-md-4 mb-3">
                            <div class="card bg-secondary">
                                <img src="https://tse3.mm.bing.net/th?id=OIF.M3VsuP%2fBaKiALUowaRKJUQ&r=0&pid=Api&h=220&P=0"
                                     class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title text-white">
                                        Movie 2
                                    </h6>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="card bg-secondary">
                                <img src="https://tse2.mm.bing.net/th/id/OIP.ygH_HKRZPDTi9EPfxnO1HwHaEK?r=0&pid=Api&h=220&P=0"
                                     class="card-img-top">
                                <div class="card-body">
                                    <h6 class="card-title text-white">
                                        Movie 3
                                    </h6>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Back -->
                <div class="mt-4">
                    <a href="index.html"
                       class="btn btn-outline-warning">
                        ← Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
